<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Sort vizualizace</title>
<style>
    body { font-family: sans-serif; background: #111; color: #eee; text-align: center; }
    #dropZone {
        border: 2px dashed #666;
        padding: 20px;
        margin: 20px;
        cursor: pointer;
    }
    canvas { background: #000; display: block; margin: auto; }
    button { margin: 10px; padding: 8px 16px; }
    #status { margin-top: 10px; font-family: monospace; }
</style>
</head>
<body>

<h2>Vizualizace swapů, porovnání a copy</h2>

<div id="dropZone">Přetáhni soubor sem nebo klikni</div>
<input type="file" id="fileInput" style="display:none">

<br>
<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>
<button onclick="nextStep()">Step</button>

<div id="status">Připraveno...</div>

<canvas id="canvas" width="1000" height="400"></canvas>

<script>
let arr = [];
let aux = [];
let ops = [];
let ctx = document.getElementById("canvas").getContext("2d");

let currentStep = 0;
let isPlaying = false;

const statusEl = document.getElementById("status");

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");

dropZone.onclick = () => fileInput.click();

fileInput.onchange = e => loadFile(e.target.files[0]);

dropZone.ondragover = e => {
    e.preventDefault();
    dropZone.style.borderColor = "lime";
};

dropZone.ondragleave = () => {
    dropZone.style.borderColor = "#666";
};

dropZone.ondrop = e => {
    e.preventDefault();
    dropZone.style.borderColor = "#666";
    loadFile(e.dataTransfer.files[0]);
};

function loadFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
        parseInput(e.target.result);
        currentStep = 0;
        draw();
        statusEl.textContent = "Načteno. Připraveno ke spuštění.";
    };
    reader.readAsText(file);
}

function parseInput(text) {
    let lines = text.trim().split("\n");

    arr = lines[0].trim().split(/\s+/).map(Number);
    aux = new Array(arr.length).fill(0);
    ops = [];

    for (let i = 1; i < lines.length; i++) {
        let line = lines[i].trim();

        if (line.startsWith("swap")) {
            let parts = line.split(/\s+/);
            ops.push({ type: "swap", i: +parts[1], j: +parts[2] });
        }

        if (line.startsWith("compare")) {
            let parts = line.split(/\s+/);
            ops.push({ type: "compare", i: +parts[1], j: +parts[2] });
        }

        if (line.startsWith("copy")) {
            let parts = line.split(/\s+/);
            ops.push({
                type: "copy",
                from: parts[1],
                i: +parts[2],
                j: +parts[3]
            });
        }
    }
}

function draw(highlight = { main: [], aux: [] }, mode = null) {
    ctx.clearRect(0, 0, 1000, 400);

    let half = 200;

    drawArray(arr, 0, half, highlight.main, mode, "main");
    drawArray(aux, half, half, highlight.aux, mode, "aux");
}

function drawArray(array, offsetY, height, highlight, mode, label) {
    let w = 1000 / array.length;
    let max = Math.max(...arr, ...aux, 1);

    for (let i = 0; i < array.length; i++) {
        let h = (array[i] / max) * (height - 20);

        if (highlight.includes(i)) {
            if (mode === "swap") ctx.fillStyle = "red";
            else if (mode === "compare") ctx.fillStyle = "cyan";
            else if (mode === "copy") ctx.fillStyle = "orange";
            else ctx.fillStyle = "yellow";
        } else {
            ctx.fillStyle = (label === "main") ? "lime" : "magenta";
        }

        ctx.fillRect(i * w, offsetY + height - h, w - 1, h);
    }

    ctx.fillStyle = "white";
    ctx.fillText(label, 10, offsetY + 12);
}

function step() {
    if (currentStep >= ops.length) {
        statusEl.textContent = "Hotovo";
        isPlaying = false;
        return;
    }

    let op = ops[currentStep];

    if (op.type === "swap") {
        [arr[op.i], arr[op.j]] = [arr[op.j], arr[op.i]];

        draw({
            main: [op.i, op.j],
            aux: []
        }, "swap");

        statusEl.textContent = "swap " + op.i + " " + op.j;
    }

    if (op.type === "compare") {
        draw({
            main: [op.i, op.j],
            aux: []
        }, "compare");

        statusEl.textContent = "compare " + op.i + " " + op.j;
    }

    if (op.type === "copy") {

        if (op.from === "main_to_aux") {
            aux[op.j] = arr[op.i];

            draw({
                main: [op.i],
                aux: [op.j]
            }, "copy");

            statusEl.textContent = `copy main[${op.i}] -> aux[${op.j}]`;
        }

        if (op.from === "aux_to_main") {
            arr[op.j] = aux[op.i];

            draw({
                main: [op.j],
                aux: [op.i]
            }, "copy");

            statusEl.textContent = `copy aux[${op.i}] -> main[${op.j}]`;
        }
    }

    currentStep++;
}

async function play() {
    if (isPlaying) return;
    isPlaying = true;

    while (isPlaying && currentStep < ops.length) {
        step();
        await sleep(80);
    }
}

function pause() {
    isPlaying = false;
}

function nextStep() {
    pause();
    step();
}

function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
}
</script>

</body>
</html>
