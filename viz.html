<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Sort vizualizace</title>
<style>
    body { font-family: sans-serif; background: #111; color: #eee; text-align: center; }
    #dropZone {
        border: 2px dashed #666;
        padding: 20px;
        margin: 20px;
        cursor: pointer;
    }
    canvas { background: #000; display: block; margin: auto; }
    button { margin: 10px; padding: 8px 16px; }
</style>
</head>
<body>

<h2>Vizualizace swapů a porovnání</h2>

<div id="dropZone">📂 Přetáhni soubor sem nebo klikni</div>
<input type="file" id="fileInput" style="display:none">

<br>
<button onclick="start()">Spustit</button>

<canvas id="canvas" width="1000" height="400"></canvas>

<script>
let arr = [];
let ops = [];
let ctx = document.getElementById("canvas").getContext("2d");

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");

dropZone.onclick = () => fileInput.click();

fileInput.onchange = e => loadFile(e.target.files[0]);

dropZone.ondragover = e => {
    e.preventDefault();
    dropZone.style.borderColor = "lime";
};

dropZone.ondragleave = () => {
    dropZone.style.borderColor = "#666";
};

dropZone.ondrop = e => {
    e.preventDefault();
    dropZone.style.borderColor = "#666";
    loadFile(e.dataTransfer.files[0]);
};

function loadFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
        parseInput(e.target.result);
        draw();
    };
    reader.readAsText(file);
}

function parseInput(text) {
    let lines = text.trim().split("\n");

    // první řádek = pole
    arr = lines[0].trim().split(/\s+/).map(Number);
    ops = [];

    for (let i = 1; i < lines.length; i++) {
        let line = lines[i].trim();

        if (line.startsWith("swap")) {
            let parts = line.split(/\s+/);
            ops.push({ type: "swap", i: +parts[1], j: +parts[2] });
        }

        if (line.startsWith("compare")) {
            let parts = line.split(/\s+/);
            ops.push({ type: "compare", i: +parts[1], j: +parts[2] });
        }
    }
}

function draw(highlight = [], mode = null) {
    ctx.clearRect(0, 0, 1000, 400);

    let w = 1000 / arr.length;
    let max = Math.max(...arr);

    for (let i = 0; i < arr.length; i++) {
        let h = (arr[i] / max) * 380;

        if (highlight.includes(i)) {
            if (mode === "swap") ctx.fillStyle = "red";
            else if (mode === "compare") ctx.fillStyle = "cyan";
            else ctx.fillStyle = "yellow";
        } else {
            ctx.fillStyle = "lime";
        }

        ctx.fillRect(i * w, 400 - h, w - 1, h);
    }
}

async function start() {
    for (let op of ops) {
        if (op.type === "swap") {
            [arr[op.i], arr[op.j]] = [arr[op.j], arr[op.i]];
            draw([op.i, op.j], "swap");
            await sleep(10);
        }

        if (op.type === "compare") {
            draw([op.i, op.j], "compare");
            await sleep(5);
        }
    }
}

function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
}
</script>

</body>
</html>
